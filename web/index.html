<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoL Overlay · 配信操作</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/layouts.css">
  <link rel="stylesheet" href="/control.css">
  <script src="/champions.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/draft-control.js" defer></script>
  <script src="/vision.js" defer></script>
</head>
<body class="control">
  <header>
    <h1>LoL Overlay</h1>
    <div class="header-right">
      <a href="/demo">試験デモ</a>
      <a href="/obs" target="_blank" rel="noopener">OBS設定</a>
    </div>
  </header>
  <main>
    <aside id="mode-banner" class="mode-banner" hidden>
      <strong>試験モード / 架空データ</strong>
      <span>試験表示を編集しています。</span>
      <button id="reset-demo" hidden>サンプルに戻す</button>
      <a href="/">本番操作へ</a>
    </aside>
    <section class="publish-bar" aria-label="配信状態と反映">
      <div class="broadcast-status">
        <span><a id="output-link" href="/overlay" target="_blank" rel="noopener">本番画面 ↗</a> <strong id="live-scene" aria-live="polite">確認中…</strong></span>
        <span class="badge" id="dirty">接続中…</span>
      </div>
      <button id="publish" class="primary" disabled>本番へ反映</button>
      <p id="message" role="status"></p>
    </section>
    <div class="control-workspace">
      <section class="monitor" aria-labelledby="preview-title">
        <h2 id="preview-title">下書きプレビュー</h2>
        <div class="preview-wrap">
          <img id="reference-bg" alt="参考映像（プレビュー専用）" hidden>
          <iframe id="preview" src="/overlay?preview=1" title="下書きのオーバーレイ"></iframe>
          <div class="preview-label">ゲーム映像が見える領域</div>
        </div>
        <div id="scene-picker" role="group" aria-label="プレビューのシーン">
          <button type="button" data-scene="draft" aria-pressed="false" disabled>BAN / PICK</button>
          <button type="button" data-scene="game" aria-pressed="false" disabled>試合中</button>
          <button type="button" data-scene="result" aria-pressed="false" disabled>試合結果</button>
          <button type="button" data-scene="cover" aria-pressed="false" disabled>中断</button>
        </div>
      </section>
      <div class="control-editor">
        <nav id="tabs" aria-label="入力項目">
          <button type="button" data-tab="teams">チーム</button>
          <button type="button" data-tab="draft">BAN / PICK</button>
          <button type="button" data-tab="match">試合中</button>
          <button type="button" data-tab="result">試合結果</button>
          <button type="button" data-tab="cover">中断</button>
        </nav>
        <details id="settings-menu">
          <summary>詳細設定</summary>
          <div class="button-row">
            <button type="button" data-tab="vision">OCR・配置調整</button>
            <button type="button" data-tab="storage">保存・次の試合</button>
          </div>
        </details>
        <section id="editor" class="editor"></section>
        <section id="vision" hidden></section>
      </div>
    </div>
  </main>
</body>
</html>
